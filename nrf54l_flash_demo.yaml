# =============================================================================
# Title:       nRF54L Flashing Demo
# Description: Programs an nRF54L15DK (SUB-75) via onboard J-Link
#              connected to a PER-101 Test Agent (SKU-7), controlled by a
#              PLT-300A (SKU-20).
# =============================================================================

# -----------------------------------------------------------------------------
# BOM - Test Station
# -----------------------------------------------------------------------------
# SKU    | Model No.            | Model Name
# -------|----------------------|---------------------------
# SKU-20 | PLT-300A             | Production Line Tool
# SKU-7  | PER-101              | Test Agent
# SUB-75 | nRF54L15DK           | Device Under Test

# -----------------------------------------------------------------------------
# Test Station Diagram (TSD)
# -----------------------------------------------------------------------------
# Device A | Connector          | Cable P/N          | Connector          | Device B
# ---------|--------------------|--------------------|--------------------|---------
# SKU-20   | USB-A (Port 6)     | TBD                | USB-C (PLT port)   | SKU-7
# SKU-7    | USB-A (Port 2)     | TBD                | USB-C              | SUB-75

# -----------------------------------------------------------------------------
# Test Plan
# -----------------------------------------------------------------------------

title: "nRF54L Flashing Demo"
description: "Flash nRF54L15DK via PER-101 Test Agent"

suite:
  
  - title: "Defines"
    steps:
      - command: define FIRMWARE "zephyr.hex"

  - title: "Setup Programming Session"
    steps:
      - command: agentCfg PROGSBC
        path: "6" 
        with:
          - "%FIRMWARE%"

  - title: "Power DUT"
    steps:
      - command: power 3V3 on
      - command: sleepms 500

  - title: "Program nRF54L via onboard J-Link"
    steps:
      - command: agentExec PROGSBC "nrfutil device recover --log-output=stdout --json"
        timeout: 30s

teardown:
  steps:
    - command: power 3V3 off
