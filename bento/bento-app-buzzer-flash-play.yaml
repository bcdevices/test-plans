# =============================================================================
# Title:       Bento App Buzzer Flash and Play
# Description: Programs a Bento Board (SUB-67) via Flashr (SKU-28)
#              connected to a PER-101 Test Agent (SKU-7), then plays the
#              firmware's default tune with "bento buzzer play" over the
#              DUT's Zephyr USB-CDC shell, controlled by a PLT-106 (SKU-6).
# =============================================================================

# -----------------------------------------------------------------------------
# BOM - Test Station
# -----------------------------------------------------------------------------
# SKU    | Model No.            | Model Name
# -------|----------------------|---------------------------
# SKU-6  | PLT-106              | Production Line Tool
# SKU-7  | PER-101              | Test Agent
# SKU-28 | PER-401              | Flashr
# SUB-67 | Bento Board          | Device Under Test

# -----------------------------------------------------------------------------
# Test Station Diagram (TSD)
# -----------------------------------------------------------------------------
# Device A | Connector          | Cable P/N          | Connector          | Device B
# ---------|--------------------|--------------------|--------------------|---------
# SKU-6    | USB-A (Port 1)     | TBD                | USB-C (PLT port)   | SKU-7
# SKU-7    | USB-A (Port 2)     | TBD                | USB                | SKU-28
# SKU-28   | 20-pin Header      | TBD                | J1 Tag-Connect     | SUB-67
# SKU-6    | USB-A (Port 2)     | TBD                | USB-C              | SUB-67

# -----------------------------------------------------------------------------
# Test Plan
# -----------------------------------------------------------------------------

# The default tune (no argument) is the first line of "Twinkle, Twinkle,
# Little Star": 14 notes, 8 s at 120 BPM.
# "bento buzzer play" blocks until the tune ends, then prints
# "played <n> notes" (n counts pauses too). The DUT echoes each command, and
# "played <n> notes" never appears in the echo, so the match is on the
# response. The buzzer has no feedback path to the PLT, so this checks that
# the firmware played the tune, not that sound came out.
title: "Bento App Buzzer Flash and Play"

suite:
  - ident: DEFS
    title: "Defines"
    steps:
      - command: define FIRMWARE.filename "bento_app.hex"
      - command: define AGENT.vidpid "6666:8001"
      - command: define FIRMWARE.target "rp2350"
      - command: define DUT.vidpid "2fe3:0004"
      - command: define DUT.prompt "bento:~$"

  - ident: PROG-1
    title: "Setup Programming Session"
    steps:
      - command: usb detect
        title: "Detect Test Agent"
        id: "%AGENT.vidpid%"
        timeout: 30s
        fail: "Test Agent not detected. Check the PER-101 USB cable to PLT Port 1."
      - command: agentCfg PROGSBC UART2
        title: "Send firmware to Test Agent"
        id: "%AGENT.vidpid%"
        retry: 3
        fail: "Could not configure the Test Agent"
        with:
          - "%FIRMWARE.filename%"

  - ident: PROG-2
    title: "Program RP2350B via Flashr"
    steps:
      - command: agentExec PROGSBC "flashr-flash %FIRMWARE.target% /run/pltagent/mnt/%FIRMWARE.filename%"
        title: "Flash and verify bento_app.hex"
        timeout: 30s
        fail: "Flashr could not program the RP2350B. Check the Tag-Connect on J1 and Bento power."

  - ident: CONN
    title: "Connect to DUT Shell"
    steps:
      - command: usb detect
        title: "Detect DUT USB-CDC device"
        id: "%DUT.vidpid%"
        timeout: 10s
        fail: "DUT USB-CDC device not detected. Check the DUT USB cable to PLT Port 2."
      - command: uartCfg UART3 115200
        title: "Configure UART to DUT"
        id: "%DUT.vidpid%"
        fail: "Failed to configure UART3 for DUT USB-CDC shell"
      # A command sent before the shell is up comes back garbled. Wait for
      # a prompt.
      - command: uart UART3
        title: "Wait for DUT shell prompt"
        send: "\n"
        expect: "%DUT.prompt%"
        timeout: 1s
        retry: 10
        fail: "DUT shell did not respond with the bento prompt."

  - ident: PLAY
    title: "Play Default Tune"
    steps:
      - command: uart UART3
        title: "Play default tune (twinkle)"
        send: "bento buzzer play\n"
        expect: "played 14 notes"
        timeout: 15s
        fail: "Tune did not finish with 'played 14 notes'. 'command not found' means the image predates bento buzzer play."
